<!DOCTYPE html>
<html class="staticrypt-html">
    <head>
        <meta charset="utf-8" />
        <title>APEX LOGIN</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- do not cache this page -->
        <meta http-equiv="cache-control" content="max-age=0" />
        <meta http-equiv="cache-control" content="no-cache" />
        <meta http-equiv="expires" content="0" />
        <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
        <meta http-equiv="pragma" content="no-cache" />

        <style>
            :root{
                --bg-gradient-start: #0f172a;
                --bg-gradient-end: #0f4c81;
                --card-bg: rgba(255,255,255,0.04);
                --card-surface: #ffffff;
                --accent: #00d1b2;
                --accent-2: #5eead4;
                --muted: rgba(255,255,255,0.85);
                --glass-blur: 8px;
                --radius: 14px;
                --max-width: 420px;
            }

            html,body{
                height:100%;
                margin:0;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
                -webkit-font-smoothing:antialiased;
                -moz-osx-font-smoothing:grayscale;
                background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
                color: var(--muted);
            }

            /* Loading spinner cover */
            .staticrypt-spinner-container {
                height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .staticrypt-spinner {
                width: 3rem;
                height: 3rem;
                border-radius: 50%;
                border: 0.35rem solid rgba(255,255,255,0.15);
                border-top-color: var(--accent);
                animation: spinner 0.85s linear infinite;
            }
            @keyframes spinner { to { transform: rotate(360deg); } }

            /* Main content container */
            .staticrypt-page {
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 2rem;
                box-sizing: border-box;
            }

            .staticrypt-form {
                width: 100%;
                max-width: var(--max-width);
                background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.02));
                border-radius: var(--radius);
                padding: 2.2rem;
                box-shadow: 0 10px 30px rgba(2,6,23,0.6);
                border: 1px solid rgba(255,255,255,0.04);
                backdrop-filter: blur(var(--glass-blur));
                color: #fff;
            }

            .brand {
                display:flex;
                align-items:center;
                gap:0.75rem;
                margin-bottom: 0.75rem;
            }

            .brand .logo {
                width:48px;
                height:48px;
                display:inline-flex;
                align-items:center;
                justify-content:center;
                background: linear-gradient(90deg,var(--accent),var(--accent-2));
                border-radius:10px;
                font-weight:700;
                color:#022;
                box-shadow: 0 6px 18px rgba(0,0,0,0.45), inset 0 -6px 16px rgba(255,255,255,0.04);
                font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial;
                font-size: 1.05rem;
            }

            .staticrypt-title {
                font-size: 1.25rem;
                font-weight: 700;
                margin:0;
                letter-spacing:0.4px;
            }

            .staticrypt-subtitle {
                margin:0;
                font-size: 0.9rem;
                color: rgba(255,255,255,0.85);
                opacity: 0.9;
            }

            .staticrypt-hr {
                margin: 1.2rem 0;
                border: 0;
                border-top: 1px solid rgba(255,255,255,0.04);
            }

            .staticrypt-password-container {
                position: relative;
                background: rgba(255,255,255,0.03);
                border-radius: 10px;
                padding: 0.4rem;
                display:flex;
                align-items:center;
                gap:0.5rem;
                margin-bottom: 1rem;
                border: 1px solid rgba(255,255,255,0.02);
            }

            .staticrypt-password-container input[type="password"],
            .staticrypt-password-container input[type="text"] {
                background: transparent;
                border: 0;
                outline: 0;
                padding: 0.85rem 0.5rem;
                color: #fff;
                font-size: 1rem;
                width: 100%;
            }

            .staticrypt-toggle-password-visibility {
                background: transparent;
                border: none;
                color: rgba(255,255,255,0.9);
                cursor: pointer;
                padding: 0.4rem;
                display:flex;
                align-items:center;
                justify-content:center;
                border-radius:8px;
            }
            .staticrypt-toggle-password-visibility svg{ width:20px; height:20px; display:block; }

            .staticrypt-decrypt-button {
                display:block;
                width:100%;
                padding: 0.95rem;
                border-radius:10px;
                border: none;
                cursor: pointer;
                font-weight:700;
                color: #06281e;
                background: linear-gradient(90deg,var(--accent),var(--accent-2));
                box-shadow: 0 8px 24px rgba(2,6,23,0.45);
                font-size: 0.98rem;
                transition: transform .08s ease, filter .08s ease;
            }
            .staticrypt-decrypt-button:active{ transform: translateY(1px); }
            .staticrypt-decrypt-button:hover{ filter:brightness(1.03); }

            label.staticrypt-remember {
                display: flex;
                align-items: center;
                gap: 0.6rem;
                margin-top: 0.75rem;
                color: rgba(255,255,255,0.85);
                font-size: 0.95rem;
            }

            label.staticrypt-remember input[type="checkbox"] {
                width:18px;
                height:18px;
                accent-color: var(--accent);
            }

            .hidden {
                display: none !important;
            }

            /* Responsive */
            @media (max-width:480px){
                .staticrypt-form { padding:1.6rem; border-radius:12px; }
                .brand .logo{ width:44px; height:44px; font-size:1rem; }
                :root{ --max-width: 92vw; }
            }
        </style>
    </head>

    <body class="staticrypt-body">
        <div id="staticrypt_loading" class="staticrypt-spinner-container">
            <div class="staticrypt-spinner"></div>
        </div>

        <div id="staticrypt_content" class="staticrypt-content hidden">

                <div class="staticrypt-form" role="main" aria-labelledby="apex-title">

                        <div>
                            <p id="apex-title" class="staticrypt-title">APEX LOGIN</p>
                            <p class="staticrypt-subtitle">Enter your passphrase to unlock the content</p>
                        </div>
                    </div>

                    <hr class="staticrypt-hr" />

                    <form id="staticrypt-form" action="#" method="post" autocomplete="off">
                        <div class="staticrypt-password-container" title="Password">
                            <input
                                id="staticrypt-password"
                                type="password"
                                name="password"
                                placeholder="Passphrase"
                                aria-label="Passphrase"
                                autofocus
                                autocomplete="new-password"
                            />

                            <!-- Toggle button uses inline SVG icons; JS will update text/aria accordingly -->
                            <button type="button" class="staticrypt-toggle-password-visibility" aria-pressed="false" aria-label="Show password">
                                <!-- Eye (closed) icon by default -->
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                                    <path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                            </button>
                        </div>

                        <label id="staticrypt-remember-label" class="staticrypt-remember hidden">
                            <input id="staticrypt-remember" type="checkbox" name="remember" />
                            Remember me (on this device)
                        </label>

                        <input type="submit" class="staticrypt-decrypt-button" value="DECRYPT" />
                    </form>
                </div>
            </div>
        </div>

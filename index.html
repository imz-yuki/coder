<!DOCTYPE html>
<html class="staticrypt-html">
    <head>

        <title>APEX LOGIN</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- do not cache this page -->
        <meta http-equiv="cache-control" content="max-age=0" />
        <meta http-equiv="cache-control" content="no-cache" />
        <meta http-equiv="expires" content="0" />
        <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
        <meta http-equiv="pragma" content="no-cache" />

        <style>
            :root{
                --bg-gradient-start: #071024;
                --bg-gradient-end: #0a4b6e;
                --accent: #00d1b2;
                --accent-2: #5eead4;
                --muted: rgba(255,255,255,0.9);
                --card-radius: 14px;
                --max-width: 420px;
            }

            html,body{height:100%;margin:0;font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial; -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;}
            body{
                background: linear-gradient(135deg,var(--bg-gradient-start) 0%,var(--bg-gradient-end) 100%);
                color:var(--muted);
            }

            .staticrypt-spinner-container{height:100vh;display:flex;align-items:center;justify-content:center;}
            .staticrypt-spinner{width:3rem;height:3rem;border-radius:50%;border:0.35rem solid rgba(255,255,255,0.12);border-top-color:var(--accent);animation:spin .85s linear infinite;}
            @keyframes spin{to{transform:rotate(360deg)}}

            .staticrypt-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem;box-sizing:border-box;}
            .staticrypt-form{width:100%;max-width:var(--max-width);background:linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.02));border-radius:var(--card-radius);padding:1.6rem 1.75rem;box-shadow:0 14px 40px rgba(2,6,23,0.6);border:1px solid rgba(255,255,255,0.03);backdrop-filter:blur(6px);}

            .brand{display:flex;gap:.7rem;align-items:center;margin-bottom:.5rem}
            .logo{width:48px;height:48px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:linear-gradient(90deg,var(--accent),var(--accent-2));font-weight:700;color:#052;box-shadow:inset 0 -6px 10px rgba(255,255,255,0.04)}
            .staticrypt-title{font-size:1.15rem;margin:0;font-weight:700}
            .staticrypt-subtitle{font-size:.92rem;margin:0;color:rgba(255,255,255,0.92)}

            .staticrypt-hr{margin:1rem 0;border:0;border-top:1px solid rgba(255,255,255,0.04)}

            .staticrypt-password-container{position:relative;background:rgba(255,255,255,0.03);border-radius:10px;padding:.3rem;display:flex;align-items:center;gap:.5rem;margin-bottom:1rem;border:1px solid rgba(255,255,255,0.02)}
            .staticrypt-password-container input[type="password"], .staticrypt-password-container input[type="text"]{background:transparent;border:0;outline:0;padding:.75rem .5rem;color:#fff;font-size:1rem;width:100%}

            /* Accessible toggle button */
            .staticrypt-toggle-password-visibility{background:transparent;border:0;padding:.35rem;cursor:pointer;color:rgba(255,255,255,0.95);display:inline-flex;align-items:center;justify-content:center;border-radius:8px}
            .staticrypt-toggle-password-visibility svg{width:20px;height:20px;display:block}

            .staticrypt-decrypt-button{display:block;width:100%;padding:.85rem;border-radius:10px;border:0;cursor:pointer;font-weight:700;color:#06281e;background:linear-gradient(90deg,var(--accent),var(--accent-2));box-shadow:0 10px 26px rgba(2,6,23,0.45);font-size:.98rem}
            .staticrypt-decrypt-button:active{transform:translateY(1px)}
            label.staticrypt-remember{display:flex;align-items:center;gap:.6rem;margin-top:.6rem;color:rgba(255,255,255,0.9);font-size:.95rem}
            input[type="checkbox"]{width:18px;height:18px;accent-color:var(--accent)}
            .hidden{display:none !important}

            @media (max-width:480px){.staticrypt-form{padding:1.2rem;border-radius:12px}}
        </style>
    </head>

    <body class="staticrypt-body">

                                placeholder="Passphrase"

                                    <path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle>
                                </svg>
                            </button>
                        </div>

                        <label id="staticrypt-remember-label" class="staticrypt-remember hidden">
                            <input id="staticrypt-remember" type="checkbox" name="remember" />
                            Remember me (on this device)
                        </label>

                        <input type="submit" class="staticrypt-decrypt-button" value="DECRYPT" />
                    </form>
                </div>
            </div>
        </div>
